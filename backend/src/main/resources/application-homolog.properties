twilio.sid=${TWILIO_SID:mock_sid}
twilio.key=${TWILIO_KEY:mock_key}
twilio.phone.from=${TWILIO_PHONE_FROM:+1234567890}
twilio.phone.to=${TWILIO_PHONE_TO:+1234567890}

spring.datasource.url=${DSMETA_DATABASE_URL}
spring.datasource.username=${DSMETA_DATABASE_USERNAME}
spring.datasource.password=${DSMETA_DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
