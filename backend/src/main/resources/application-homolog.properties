twilio.sid=${TWILIO_SID:mock_sid}
twilio.key=${TWILIO_KEY:mock_key}
twilio.phone.from=${TWILIO_PHONE_FROM:+1234567890}
twilio.phone.to=${TWILIO_PHONE_TO:+1234567890}

spring.datasource.url=${DSMETA_DATABASE_URL}
spring.datasource.username=${DSMETA_DATABASE_USERNAME}
spring.datasource.password=${DSMETA_DATABASE_PASSWORD}

# Hibernate / JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# SQL Initialization configuration (replaces neighboring import.sql strategy via Spring Boot 3 JDBC)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Port configuration
server.port=${DSMETA_BACKEND_PORT:8080}

# Trusted headers strategy for Reverse Proxy (Nginx) over HTTPS
server.forward-headers-strategy=FRAMEWORK

# CORS Settings
cors.allow.frontend=${DSMETA_FRONTEND_URL:http://localhost:3000}
