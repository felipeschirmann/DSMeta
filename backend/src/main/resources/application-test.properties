twilio.sid=${TWILIO_SID:mock_sid}
twilio.key=${TWILIO_KEY:mock_key}
twilio.phone.from=${TWILIO_PHONE_FROM:+1234567890}
twilio.phone.to=${TWILIO_PHONE_TO:+1234567890}

server.port=${DSMETA_BACKEND_PORT:8080}
cors.allow.frontend=${DSMETA_FRONTEND_URL:http://localhost:3000}

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true