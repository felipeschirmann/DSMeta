spring.datasource.url=${DSMETA_DATABASE_URL:jdbc:postgresql://host:port/db}
spring.datasource.username=${DSMETA_DATABASE_USERNAME:username}
spring.datasource.password=${DSMETA_DATABASE_PASSWORD:password}

server.port=${DSMETA_BACKEND_PORT:port}
cors.allow.frontend=${DSMETA_FRONTEND_URL:http://localhost:5173}

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true